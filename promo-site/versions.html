    <main id="top">
      <section class="section">
        <div class="container">
          <div class="sectionHead">
            <h2 class="sectionHead__title" data-i18n="versions.title"></h2>
            <p class="sectionHead__subtitle" data-i18n="versions.subtitle"></p>
          </div>
          
          <div class="panel">
            <div style="overflow-x: auto;">
              <table style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                  <tr style="border-bottom: 1px solid var(--border);">
                    <th style="padding: 16px;" data-i18n="versions.colVer"></th>
                    <th style="padding: 16px;" data-i18n="versions.colDate"></th>
                    <th style="padding: 16px;" data-i18n="versions.colDesc"></th>
                    <th style="padding: 16px;" data-i18n="versions.colAction"></th>
                  </tr>
                </thead>
                <tbody id="versionList">
                  <!-- Populated by JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__grid">
        <div class="footer__brand">
          <div class="footer__name">智心一梦</div>
          <div class="footer__desc" data-i18n="footer.desc"></div>

        </div>
        <div class="footer__cols">

            <div class="footerCol__t" data-i18n="footer.product.t"></div>

            <a class="footerCol__l" data-link="docs" href="#" data-i18n="footer.resources.l1"></a>
            <a class="footerCol__l" data-link="changelog" href="#" data-i18n="footer.resources.l2"></a>
            <a class="footerCol__l" data-link="release" href="#" data-i18n="footer.resources.l3"></a>
          </div>
          <div class="footerCol">
            <div class="footerCol__t" data-i18n="footer.contact.t"></div>
            <a class="footerCol__l" data-link="support" href="#" data-i18n="footer.contact.l1"></a>
            <a class="footerCol__l" data-link="privacy" href="#" data-i18n="footer.contact.l2"></a>
            <a class="footerCol__l" data-link="github" href="#" data-i18n="footer.contact.l3"></a>
          </div>
        </div>
      </div>

    <script defer src="./main.js"></script>
    <script>
      function renderVersions() {
        const list = document.getElementById('versionList');
        if (!list || !siteConfig.versions) return;

        list.innerHTML = siteConfig.versions.map(v => `
          <tr style="border-bottom: 1px solid var(--border);">
            <td style="padding: 16px; font-weight: bold; white-space: nowrap;">v${v.ver}</td>
            <td style="padding: 16px; color: var(--muted); font-size: 0.9em; white-space: nowrap;">${v.date}</td>
            <td style="padding: 16px; color: var(--muted); line-height: 1.5;">${v.desc}</td>
            <td style="padding: 16px; white-space: nowrap;">
              <a href="${v.file.startsWith('http') ? v.file : 'version/' + v.file}" class="btn btn--ghost" style="padding: 8px 16px; font-size: 0.85em;">
                <span data-i18n="versions.download">Download</span>
              </a>
            </td>
          </tr>
        `).join('');
        
        const currentLang = localStorage.getItem("promoLang") || "zh";
        if (typeof applyI18n === 'function') {
             applyI18n(currentLang);
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        // Wait a tick for main.js to potentially finish its boot if needed, though defer should handle order.
        // main.js is deferred, so it runs after DOM parsing but before DOMContentLoaded (usually).
        // To be safe, we can check if siteConfig exists.
        if (typeof siteConfig !== 'undefined') {
            renderVersions();
        } else {
            // Fallback or retry
            setTimeout(renderVersions, 100);
        }
      });
    </script>
  </body>
